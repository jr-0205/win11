name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Generate portable EXE
        shell: pwsh
        run: .\exe-generated.ps1 -Clean -PortableOnly

      - name: Upload portable EXE
        uses: actions/upload-artifact@v4
        with:
          name: Windows11Optimizer-v0.9.0-win-x64
          path: artifacts\portable\
          if-no-files-found: error
