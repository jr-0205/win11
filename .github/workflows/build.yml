name: build-windows

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore .\Windows11Optimizer.sln

      - name: Build
        run: dotnet build .\Windows11Optimizer.sln -c Release --no-restore

      - name: Publish win-x64
        run: >-
          dotnet publish .\src\Windows11Optimizer\Windows11Optimizer.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o .\publish

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Windows11Optimizer-win-x64
          path: publish\
